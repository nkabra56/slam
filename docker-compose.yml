services:
  slam:
    build:
      context: .
      target: runtime
    image: slam:runtime
    volumes:
      - ./data:/data:ro
    command: ["/bin/bash"]

  # Runs slam_node against real ROS2 topics/a bag. Point it at your
  # sensor/bag source with --network host or additional volume/env config
  # as needed -- this compose service is a starting point, not a complete
  # sensor integration (see README.md's "Running on ROS2" section).
  slam-ros2:
    build:
      context: .
      target: ros2
    image: slam:ros2
    volumes:
      - ./data:/data:ro
    command: >
      /bin/bash -c "source /opt/ros/humble/setup.bash &&
      source /ros2_ws/install/setup.bash &&
      ros2 launch slam_ros2 slam.launch.py"
